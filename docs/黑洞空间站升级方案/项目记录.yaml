  - date: 2026-09-29
    scope: 场景视觉优先与制作工具授权
    decision: 先完成场景与渲染，再逐步增加交互；Blender 和 Meshy 按需使用不设上限，Meshy 积分不足时停止并向用户报告
    source: 用户要求写方案，并明确 Blender／Meshy 使用额度及不足时处理
    proposal_only: 东南咖啡厅—短廊—黑洞观景台为首个样板建议；v011 已成文，参考图片目视、最终造型、样板施工与审美认可尚未完成
  - date: 2026-09-27
    scope: 利用两侧三角区
    decision: 东侧居民公共客厅连接角色居住街区，西侧观测展厅或科研庭院连接科研区，保留中央贯通黑洞的空洞
    source: 用户同意利用原三角留空并要求修改方案
    superseded_by: 2026-09-28 第一人称与外围十字四区；公共职能迁出核心
  - date: 2026-09-27
    scope: 普通对局与冠军决赛结算演出
    decision: 普通对局双方各乘原板原电梯返航；仅冠军决赛败者板消失坠入黑洞，冠军板升空接上方下落奖杯，再安全返航
    source: 用户最新明确区分普通胜利和冠军演出
  - date: 2026-09-27
    scope: 宏观空间主尺度
    decision: 从一开始扩大主空间骨架；方形生活层灰盒 240 × 240 m，竞技菱形四端距中心约 100 m，保留中心环台 44 m 外径与 20 m 通孔
    source: 用户要求宏大场景和背景，不要做得太小气
    superseded_by: 2026-09-28 中央比例修正与小规模开放世界目标
  - date: 2026-09-28
    scope: 中央环台比例
    decision: 在 240 m 核心区灰盒中把环台改为 72 m 外径、约 32.73 m 中孔；中央井、平台与观众路线重新验证
    source: 用户指定放大中央环台到接近最初概念图比例
    superseded_by: 2026-09-28 井口比例复验
  - date: 2026-09-28
    scope: 中央井口比例复验
    decision: 保留 72 m 环台外径和空间站拓扑，将灰盒中央开口扩至 50 m；尚未获得最终视觉批准
    source: 最初总览图与同机位灰盒对照，以及独立机械和 Player 回归
  - date: 2026-09-28
    scope: 游戏最终形态
    decision: 以最初概念图的空间站为核心，建设多层、多区、含站外设施的连续小规模开放世界；现有 240 m 场景仅为核心区原型
    source: 用户明确纠正单一小场馆定位，并选择连续空间站世界
  - date: 2026-09-28
    scope: 第一人称与外围十字四区
    decision: 默认第一人称；现有建筑改造为角色住处和中央擂台体系；向外扩建圆形世界，以十字划分四个主要漫游区，整体继续位于黑洞之上
    source: 用户本轮文字与圆形外围十字分区手绘图
    proposal_only: 四区主题和 720 m 外径仍是未获最终视觉批准的候选；W1 四区连通、W2 东南样板和 W3 其余三区迁移灰盒已独立施工
  - date: 2026-09-28
    scope: 模型的家、访客起点与后续扩建
    decision: 核心住房属于大模型而非玩家；访客从东北港区抵达，旧玩家舱改为 DeepSeek 住所；西侧住宅保留未分配模块位及封闭扩建边界，不把六间作为未来上限
    source: 用户纠正家的定义、选择东北港区抵达，并要求考虑后续扩建
